# =============================================================================
# Distribution Profile
# =============================================================================
# This profile is used for deployable environments (dev, int, qa, pro).
# All sensitive and environment-specific settings are externalized via
# environment variables or external property files (template-properties).
# =============================================================================

spring:
  main:
    # Sin banner de Spring Boot en el log de WildFly
    banner-mode: off
  datasource:
    # DataSource gestionado por WildFly (standalone.xml). Sustituye a url/username/password.
    jndi-name: java:jboss/datasources/TemplateDS

  liquibase:
    # El esquema se gestiona fuera de la aplicación (scripts SQL generados con
    # generate-sql); al arrancar no se ejecuta ningún changeset.
    enabled: false

  jpa:
    hibernate:
      # Sólo valida que las entidades coincidan con el esquema existente; no modifica nada.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT configuration (externalized - secrets MUST be provided)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Refresh token cookie configuration (externalized)
auth:
  cookie:
    name: ${AUTH_COOKIE_NAME:__Host-refresh-token}
    path: ${AUTH_COOKIE_PATH:/template/api/v1/auth}
    max-age-seconds: ${AUTH_COOKIE_MAX_AGE:604800}
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}

# Cluster configuration (externalized)
cluster:
  heartbeat-interval: ${CLUSTER_HEARTBEAT_INTERVAL:30000}
  dead-node-timeout: ${CLUSTER_DEAD_NODE_TIMEOUT:300000}
