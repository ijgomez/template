# =============================================================================
# Distribution Profile
# =============================================================================
# This profile is used for deployable environments (dev, int, qa, pro).
# All sensitive and environment-specific settings are externalized via
# environment variables or external property files (template-properties).
# =============================================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Server configuration (externalized)
server:
  port: ${SERVER_PORT:8080}

# JWT configuration (externalized - secrets MUST be provided)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# CORS configuration (externalized)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Cluster configuration (externalized)
cluster:
  heartbeat-interval: ${CLUSTER_HEARTBEAT_INTERVAL:30000}
  dead-node-timeout: ${CLUSTER_DEAD_NODE_TIMEOUT:300000}

# Logging (production-level)
logging:
  level:
    root: WARN
    org.myorganization.template: INFO
    org.springframework.security: WARN
