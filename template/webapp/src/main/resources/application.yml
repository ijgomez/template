spring:
  application:
    name: template

  profiles:
    active: @spring.profiles.active@

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: template
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        one-indexed-parameters: false
        default-page-size: 10
        max-page-size: 100

  jackson:
    time-zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Los objetos y las semillas sin esquema explícito se resuelven en este esquema
    default-schema: template

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /template

# Actuator (SEC-09): solo se expone "health" (sin detalles); el resto de
# endpoints queda denegado en SecurityConfig (deny by default).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# JWT configuration
# SEC-03: sin secreto por defecto en el repositorio. Cada perfil debe aportar su
# propio valor (application-local.yml y application-test.yml lo definen; los
# entornos desplegables lo externalizan obligatoriamente vía JWT_SECRET).
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Refresh token cookie configuration
auth:
  cookie:
    # Prefijo __Secure- (exige Secure, admite Path restringido). __Host- no es válido aquí:
    # obliga a Path=/ y el navegador descartaría la cookie con el path de la API de auth.
    name: ${AUTH_COOKIE_NAME:__Secure-refresh-token}
    path: ${AUTH_COOKIE_PATH:/template/api/v1/auth}
    max-age-seconds: ${AUTH_COOKIE_MAX_AGE:604800}
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  # SEC-06: account lockout after consecutive failed logins. The state is stored in
  # the users table, so every cluster node shares the same counter and lock window.
  login-attempts:
    max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
    lockout-minutes: ${AUTH_LOGIN_LOCKOUT_MINUTES:15}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Cluster configuration
cluster:
  heartbeat-interval: ${CLUSTER_HEARTBEAT_INTERVAL:30000}
  dead-node-timeout: ${CLUSTER_DEAD_NODE_TIMEOUT:300000}
