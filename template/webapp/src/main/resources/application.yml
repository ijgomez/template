spring:
  application:
    name: template

  profiles:
    active: @spring.profiles.active@

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        one-indexed-parameters: false
        default-page-size: 10
        max-page-size: 100

  jackson:
    time-zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /template

# JWT configuration
jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production-min-32-chars}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Cluster configuration
cluster:
  heartbeat-interval: ${CLUSTER_HEARTBEAT_INTERVAL:30000}
  dead-node-timeout: ${CLUSTER_DEAD_NODE_TIMEOUT:300000}
