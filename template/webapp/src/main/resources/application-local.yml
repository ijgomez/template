spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/template
    username: template
    password: template
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.myorganization.template: DEBUG
    org.springframework.security: DEBUG
