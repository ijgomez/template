# =============================================================================
# Local Development Profile
# =============================================================================
# This profile is intended for local developer machines.
# Uses an in-memory H2 database (PostgreSQL compatibility mode) so no external
# database is required. Schema and seed data are created at startup by Liquibase.
# =============================================================================

spring:
  datasource:
    # H2 en memoria con modo de compatibilidad PostgreSQL. DB_CLOSE_DELAY=-1
    # mantiene la BD viva mientras la JVM esté activa; NON_KEYWORDS=USER evita
    # conflictos con la tabla 'users'.
    url: jdbc:h2:mem:template;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  liquibase:
    contexts: local

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Server configuration (local)
server:
  port: 8080

# JWT configuration (local development - NOT for production)
jwt:
  secret: template-local-dev-secret-key-minimum-32-characters-long
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

# Refresh token cookie configuration (local - HTTP compatible)
auth:
  cookie:
    name: refresh-token
    path: /template/api/v1/auth
    max-age-seconds: 604800
    secure: false
    same-site: Lax

# CORS configuration (local Angular dev server)
cors:
  allowed-origins: http://localhost:4200

# Cluster configuration (local)
cluster:
  heartbeat-interval: 30000
  dead-node-timeout: 300000

# Logging (verbose for local development)
logging:
  level:
    root: INFO
    org.myorganization.template: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
