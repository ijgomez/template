# =============================================================================
# Test Profile
# =============================================================================
# This profile is activated by the 'test' Maven profile.
# Uses Testcontainers for PostgreSQL (auto-configured by Spring Boot).
# Suitable for integration tests and CI/CD pipelines.
# =============================================================================

spring:
  main:
    # Desactiva el banner de Spring Boot en los tests (ruido en consola)
    banner-mode: off
  datasource:
    url: jdbc:tc:postgresql:18:///template_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Server configuration (test)
server:
  port: 0

# JWT configuration (fixed secret for deterministic test behavior)
jwt:
  secret: test-secret-key-for-automated-testing-minimum-32-characters
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# CORS configuration (test - allow all origins)
cors:
  allowed-origins: http://localhost:4200

# Cluster configuration (test - shorter intervals for faster tests)
cluster:
  heartbeat-interval: 5000
  dead-node-timeout: 15000

# El logging en los tests lo controla exclusivamente logback-test.xml
# (src/test/resources/logback-test.xml). No se definen aquí niveles de
# logging para mantener una única fuente de verdad.
