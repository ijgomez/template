<select class="form-select form-select-sm"
        [ngClass]="{ 'is-invalid': isInvalid() }"
        [value]="selectedId() ?? ''"
        (change)="onSelectionChange(parseSelection($any($event.target).value))"
        (blur)="onBlur()"
        [name]="name"
        [required]="required"
        [disabled]="disabled()"
        [attr.aria-label]="ariaLabelKey ? (ariaLabelKey | translate) : null"
        [attr.data-testid]="testId">
  @if (placeholderSelectable) {
    <option value="">{{ placeholderKey | translate }}</option>
  } @else {
    <option value="" disabled>{{ placeholderKey | translate }}</option>
  }
  @for (profile of profiles(); track profile.id) {
    <option [value]="profile.id">{{ profile.name }}</option>
  }
</select>
