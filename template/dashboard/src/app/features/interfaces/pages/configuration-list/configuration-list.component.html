<!-- ═══════════════════════════════════════════════════════════════════════════
     INTERFACE CONFIGURATION LIST VIEW
     ═══════════════════════════════════════════════════════════════════════════ -->
@if (viewMode() === 'list') {
  <!-- Title -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ 'interfaces.configuration.title' | translate }}</h1>
  </div>

  <!-- Filter bar -->
  <div class="tp-filter-bar">
    <form class="row g-3 align-items-end" (ngSubmit)="applyFilters()" aria-label="Filtros de búsqueda de interfaces" data-testid="config-filter-form">
      <div class="col-md-3">
        <label for="filterName" class="form-label">{{ 'interfaces.configuration.fields.name' | translate }}</label>
        <input id="filterName" type="text" class="form-control form-control-sm"
               [ngModel]="filterName()" (ngModelChange)="filterName.set($event)" name="filterName"
               [placeholder]="'interfaces.configuration.fields.name' | translate" data-testid="filter-name">
      </div>
      <div class="col-md-3">
        <label for="filterProtocol" class="form-label">{{ 'interfaces.configuration.fields.protocol' | translate }}</label>
        <tp-protocol-select
          id="filterProtocol"
          [ngModel]="filterProtocol()" (ngModelChange)="filterProtocol.set($event)" name="filterProtocol"
          [placeholderSelectable]="true"
          placeholderKey="interfaces.configuration.filters.allProtocols"
          ariaLabelKey="interfaces.configuration.fields.protocol"
          testId="filter-protocol" />
      </div>
      <div class="col-md-3">
        <label for="filterStatus" class="form-label">{{ 'interfaces.configuration.fields.status' | translate }}</label>
        <select id="filterStatus" class="form-select form-select-sm"
                [ngModel]="filterStatus()" (ngModelChange)="filterStatus.set($event)" name="filterStatus"
                [attr.aria-label]="'interfaces.configuration.fields.status' | translate" data-testid="filter-status">
          <option value="">{{ 'interfaces.configuration.filters.allStatuses' | translate }}</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
          <option value="ERROR">ERROR</option>
        </select>
      </div>
      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <button type="submit" class="btn btn-primary btn-sm" data-testid="btn-filter-search">
          <i class="bi bi-search me-1" aria-hidden="true"></i> {{ 'button.filter' | translate }}
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clearFilters()" data-testid="btn-filter-clear">
          <i class="bi bi-x-circle me-1" aria-hidden="true"></i> {{ 'interfaces.configuration.filters.clear' | translate }}
        </button>
      </div>
    </form>
  </div>

  <!-- Action toolbar -->
  <div class="tp-toolbar d-flex gap-2 mb-3">
    <tp-detail-button
      [disabled]="!selectedRow()"
      testId="btn-view-detail"
      (detail)="viewSelectedDetail()" />
    <button type="button" class="btn btn-outline-secondary btn-sm ms-auto" (click)="exportCsv()" data-testid="btn-export">
      <i class="bi bi-download me-1" aria-hidden="true"></i> {{ 'button.export' | translate }}
    </button>
  </div>

  <!-- Data table -->
  <tp-data-table
    [columns]="columns"
    [data]="paginatedConfigs()"
    [loading]="isLoading()"
    [totalElements]="totalElements()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [pageSizes]="pageSizes"
    [selectable]="true"
    [selectedItem]="selectedRow()"
    (rowSelect)="selectRow($event)"
    (rowDoubleClick)="viewDetail($event)"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="changePageSize($event)"
    (sortChange)="onSort($event)"
    ariaLabel="Listado de interfaces"
    testId="configuration-table">

    <ng-template tpColumn="protocol" let-config>
      <span class="badge"
            [class.bg-primary-subtle]="config.protocol === 'REST'"
            [class.text-primary]="config.protocol === 'REST'"
            [class.bg-secondary-subtle]="config.protocol !== 'REST'"
            [class.text-secondary]="config.protocol !== 'REST'">
        {{ config.protocol }}
      </span>
    </ng-template>

    <ng-template tpColumn="url" let-config>
      <code class="small">{{ config.url }}</code>
    </ng-template>

    <ng-template tpColumn="status" let-config>
      <span class="badge"
            [class.bg-success]="config.status === 'ACTIVE'"
            [class.bg-danger]="config.status === 'ERROR'"
            [class.bg-secondary]="config.status === 'INACTIVE'">
        <i class="bi me-1"
           [class.bi-check-circle-fill]="config.status === 'ACTIVE'"
           [class.bi-x-circle-fill]="config.status === 'ERROR'"
           [class.bi-dash-circle-fill]="config.status === 'INACTIVE'"
           aria-hidden="true"></i>
        {{ config.status }}
      </span>
    </ng-template>

    <ng-template tpColumn="checkFrequency" let-config>
      {{ config.checkFrequency }}s
    </ng-template>

    <ng-template tpColumn="lastModifiedAt" let-config>
      {{ config.lastModifiedAt | localDate }}
    </ng-template>
  </tp-data-table>
}

<!-- ═══════════════════════════════════════════════════════════════════════════
     INTERFACE CONFIGURATION DETAIL VIEW
     ═══════════════════════════════════════════════════════════════════════════ -->
@if (viewMode() === 'detail') {
  <app-configuration-form
    mode="view"
    [config]="selectedConfig()"
    (back)="backToList()"
    (cancelled)="backToList()" />
}
