<!-- ═══════════════════════════════════════════════════════════════════════════
     ACTIONS LIST VIEW
     ═══════════════════════════════════════════════════════════════════════════ -->
@if (viewMode() === 'list') {
  <!-- Title -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">{{ 'actions.title' | translate }}</h1>
  </div>

  <!-- Filter bar -->
  <div class="tp-filter-bar">
    <form class="row g-3 align-items-end" (ngSubmit)="applyFilters()" aria-label="Filtros de búsqueda de acciones" data-testid="actions-filter-form">
      <div class="col-md-4">
        <label for="filterCode" class="form-label">{{ 'actions.fields.code' | translate }}</label>
        <input id="filterCode" type="text" class="form-control form-control-sm"
               [ngModel]="filterCode()" (ngModelChange)="filterCode.set($event)" name="filterCode"
               [placeholder]="'actions.fields.code' | translate" data-testid="filter-code">
      </div>
      <div class="col-md-4">
        <label for="filterType" class="form-label">{{ 'actions.fields.type' | translate }}</label>
        <select id="filterType" class="form-select form-select-sm"
                [ngModel]="filterType()" (ngModelChange)="filterType.set($event)" name="filterType"
                [attr.aria-label]="'actions.fields.type' | translate" data-testid="filter-type">
          <option value="">{{ 'actions.filters.allTypes' | translate }}</option>
          @for (type of actionTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="col-12 d-flex justify-content-end gap-2 mt-2">
        <button type="submit" class="btn btn-primary btn-sm" data-testid="btn-filter-search">
          <i class="bi bi-search me-1" aria-hidden="true"></i> {{ 'button.filter' | translate }}
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clearFilters()" data-testid="btn-filter-clear">
          <i class="bi bi-x-circle me-1" aria-hidden="true"></i> {{ 'actions.filters.clear' | translate }}
        </button>
      </div>
    </form>
  </div>

  <!-- Action toolbar -->
  <div class="tp-toolbar d-flex gap-2 mb-3">
    @if (canEdit()) {
      <button type="button" class="btn btn-warning btn-sm text-white" [disabled]="!selectedRow()" (click)="editSelectedAction()" data-testid="btn-edit">
        <i class="bi bi-pencil me-1" aria-hidden="true"></i> {{ 'button.edit' | translate }}
      </button>
    }
    <button type="button" class="btn btn-outline-secondary btn-sm ms-auto" (click)="exportCsv()" data-testid="btn-export">
      <i class="bi bi-download me-1" aria-hidden="true"></i> {{ 'button.export' | translate }}
    </button>
  </div>

  <!-- Data table -->
  <tp-data-table
    [columns]="columns"
    [data]="actions()"
    [loading]="isLoading()"
    [totalElements]="totalElements()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [selectable]="true"
    [selectedItem]="selectedRow()"
    (rowSelect)="selectRow($event)"
    (rowDoubleClick)="showDetail($event)"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="changePageSize($event)"
    (sortChange)="onSort($event)"
    ariaLabel="Listado de acciones"
    testId="actions-table">

    <!-- Custom column: type (colored badge) -->
    <ng-template tpColumn="type" let-action>
      <span class="badge"
            [class.bg-info-subtle]="action.type === 'READ'"
            [class.text-info]="action.type === 'READ'"
            [class.bg-warning-subtle]="action.type === 'WRITE'"
            [class.text-warning]="action.type === 'WRITE'"
            [class.bg-success-subtle]="action.type === 'EXECUTE'"
            [class.text-success]="action.type === 'EXECUTE'">
        {{ action.type }}
      </span>
    </ng-template>

    <!-- Custom column: description (fallback) -->
    <ng-template tpColumn="description" let-action>
      {{ action.description ?? '-' }}
    </ng-template>
  </tp-data-table>
}

<!-- ═══════════════════════════════════════════════════════════════════════════
     DETAIL VIEW
     ═══════════════════════════════════════════════════════════════════════════ -->
@if (viewMode() === 'detail') {
  @if (selectedAction(); as action) {
    <app-action-form
      [mode]="'view'"
      [action]="action"
      [canEdit]="canEdit()"
      (cancel)="backToList()"
      (edit)="showEditForm($event)" />
  }
}

<!-- ═══════════════════════════════════════════════════════════════════════════
     EDIT FORM (No Create - Req 25.11)
     ═══════════════════════════════════════════════════════════════════════════ -->
@if (viewMode() === 'edit') {
  @if (selectedAction(); as action) {
    <app-action-form
      [mode]="'edit'"
      [action]="action"
      [saving]="isSaving()"
      [canEdit]="canEdit()"
      (save)="saveAction($event)"
      (cancel)="backToList()" />
  }
}
