<div>
  @if (loading()) {
    <div class="d-flex justify-content-center py-5" data-testid="profile-loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">{{ 'common.loading' | translate }}</span>
      </div>
    </div>
  } @else {
    <app-user-form
      [mode]="mode() === 'view' ? 'view' : 'edit'"
      [user]="profileUser()"
      [canWrite]="false"
      [canEditView]="true"
      [requireProfile]="false"
      (edit)="onEdit()"
      (save)="onSave($event)"
      (cancel)="onCancel()" />
  }
</div>
