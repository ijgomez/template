<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ 'cluster.nodes.form.title' | translate }}</h1>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm"
            (click)="onBack()"
            data-testid="node-detail-btn-back">
      <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{{ 'button.back' | translate }}
    </button>
  </div>
</div>

<div class="tp-filter-bar" data-testid="node-form-card">
  <!-- Datos del nodo (solo lectura, Req 25.11) -->
  <h6 class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
    {{ 'cluster.nodes.form.sectionNode' | translate }}
  </h6>
  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.hostname' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="node().hostname"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.hostname' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.ip' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="node().ip ?? '-'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.ip' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.status' | translate }}</label>
      <div>
        <span class="badge"
              [class.bg-success]="node().status === 'ACTIVE'"
              [class.bg-danger]="node().status === 'INACTIVE'">
          {{ 'cluster.nodes.status.' + node().status.toLowerCase() | translate }}
        </span>
      </div>
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.master' | translate }}</label>
      <div>
        @if (node().master) {
          <span class="badge bg-primary">MASTER</span>
        } @else {
          <span class="text-muted">&mdash;</span>
        }
      </div>
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.startedAt' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="(node().startedAt | localDate) ?? ''"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.startedAt' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.lastModifiedAt' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="(node().lastModifiedAt | localDate) ?? ''"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.lastModifiedAt' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.usedMemoryGb' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="(node().usedMemory / 1073741824 | number:'1.2-2') + ' GB'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.usedMemoryGb' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.totalMemoryGb' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="(node().totalMemory / 1073741824 | number:'1.2-2') + ' GB'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.totalMemoryGb' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1">{{ 'cluster.nodes.fields.freeMemoryPercent' | translate }}</label>
      <input type="text"
             class="form-control form-control-sm"
             [value]="((node().totalMemory > 0 ? ((node().totalMemory - node().usedMemory) / node().totalMemory * 100) : 0) | number:'1.1-1') + '%'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.freeMemoryPercent' | translate">
    </div>
  </div>
</div>

<app-node-jobs [nodeId]="node().id" />
