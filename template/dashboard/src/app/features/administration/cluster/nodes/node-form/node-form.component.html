<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ 'cluster.nodes.form.title' | translate }}</h1>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm"
            (click)="onBack()"
            data-testid="node-detail-btn-back">
      <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{{ 'button.back' | translate }}
    </button>
  </div>
</div>

<div class="tp-filter-bar" data-testid="node-form-card">
  <!-- Datos del nodo (solo lectura, Req 25.11) -->
  <h6 class="tp-section-label text-muted text-uppercase fw-semibold mb-2">
    {{ 'cluster.nodes.form.sectionNode' | translate }}
  </h6>
  <div class="row g-2 mb-3">
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-hostname">{{ 'cluster.nodes.fields.hostname' | translate }}</label>
      <input id="node-hostname"
             type="text"
             class="form-control form-control-sm"
             [value]="node().hostname"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.hostname' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-ip">{{ 'cluster.nodes.fields.ip' | translate }}</label>
      <input id="node-ip"
             type="text"
             class="form-control form-control-sm"
             [value]="node().ip ?? '-'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.ip' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-status-select">{{ 'cluster.nodes.fields.status' | translate }}</label>
      <select id="node-status-select"
              class="form-select form-select-sm"
              disabled
              [attr.aria-label]="'cluster.nodes.fields.status' | translate"
              data-testid="node-form-status-select">
        <option value="ACTIVE" [selected]="node().status === 'ACTIVE'">{{ 'cluster.nodes.status.active' | translate }}</option>
        <option value="INACTIVE" [selected]="node().status === 'INACTIVE'">{{ 'cluster.nodes.status.inactive' | translate }}</option>
      </select>
    </div>
    <div class="col-md-4">
      <span class="form-label form-label-sm mb-1 d-block">{{ 'cluster.nodes.fields.master' | translate }}</span>
      <div>
        @if (node().master) {
          <span class="badge bg-primary">MASTER</span>
        } @else {
          <span class="text-muted">&mdash;</span>
        }
      </div>
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-started-at">{{ 'cluster.nodes.fields.startedAt' | translate }}</label>
      <input id="node-started-at"
             type="text"
             class="form-control form-control-sm"
             [value]="(node().startedAt | localDate) ?? ''"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.startedAt' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-last-modified-at">{{ 'cluster.nodes.fields.lastModifiedAt' | translate }}</label>
      <input id="node-last-modified-at"
             type="text"
             class="form-control form-control-sm"
             [value]="(node().lastModifiedAt | localDate) ?? ''"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.lastModifiedAt' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-used-memory">{{ 'cluster.nodes.fields.usedMemoryGb' | translate }}</label>
      <input id="node-used-memory"
             type="text"
             class="form-control form-control-sm"
             [value]="(node().usedMemory / 1073741824 | number:'1.2-2') + ' GB'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.usedMemoryGb' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-total-memory">{{ 'cluster.nodes.fields.totalMemoryGb' | translate }}</label>
      <input id="node-total-memory"
             type="text"
             class="form-control form-control-sm"
             [value]="(node().totalMemory / 1073741824 | number:'1.2-2') + ' GB'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.totalMemoryGb' | translate">
    </div>
    <div class="col-md-4">
      <label class="form-label form-label-sm mb-1" for="node-free-memory">{{ 'cluster.nodes.fields.freeMemoryPercent' | translate }}</label>
      <input id="node-free-memory"
             type="text"
             class="form-control form-control-sm"
             [value]="((node().totalMemory > 0 ? ((node().totalMemory - node().usedMemory) / node().totalMemory * 100) : 0) | number:'1.1-1') + '%'"
             readonly
             disabled
             [attr.aria-label]="'cluster.nodes.fields.freeMemoryPercent' | translate">
    </div>
  </div>
</div>

<app-node-jobs [nodeId]="node().id" />
