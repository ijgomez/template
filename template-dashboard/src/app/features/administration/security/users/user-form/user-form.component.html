<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">
    {{ (mode() === 'create' ? 'users.form.createTitle' : 'users.form.editTitle') | translate }}
  </h1>
</div>

<div class="tp-filter-bar">
  <form id="userForm" (ngSubmit)="onSubmit()" #userForm="ngForm" novalidate data-testid="user-form">
    <!-- Datos generales -->
    <h6 class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
      {{ 'users.form.sectionGeneral' | translate }}
    </h6>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label for="username" class="form-label form-label-sm mb-1">
          {{ 'users.fields.username' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="username"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="formUser().username"
               (ngModelChange)="updateField('username', $event)"
               name="username"
               required
               [readonly]="mode() === 'edit'"
               data-testid="input-username">
      </div>
      <div class="col-md-4">
        <label for="password" class="form-label form-label-sm mb-1">
          {{ 'users.fields.password' | translate }}
          @if (mode() === 'create') { <span class="text-danger">*</span> }
        </label>
        <input id="password"
               type="password"
               class="form-control form-control-sm"
               [ngModel]="formUser().password"
               (ngModelChange)="updateField('password', $event)"
               name="password"
               [required]="mode() === 'create'"
               data-testid="input-password">
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label form-label-sm mb-1">
          {{ 'users.fields.email' | translate }}
        </label>
        <input id="email"
               type="email"
               class="form-control form-control-sm"
               [ngModel]="formUser().email ?? ''"
               (ngModelChange)="updateField('email', $event || null)"
               name="email"
               placeholder="usuario@ejemplo.com"
               data-testid="input-email">
      </div>
      <div class="col-md-4">
        <label for="firstName" class="form-label form-label-sm mb-1">
          {{ 'users.fields.firstName' | translate }}
        </label>
        <input id="firstName"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="formUser().firstName ?? ''"
               (ngModelChange)="updateField('firstName', $event || null)"
               name="firstName"
               data-testid="input-first-name">
      </div>
      <div class="col-md-4">
        <label for="lastName" class="form-label form-label-sm mb-1">
          {{ 'users.fields.lastName' | translate }}
        </label>
        <input id="lastName"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="formUser().lastName ?? ''"
               (ngModelChange)="updateField('lastName', $event || null)"
               name="lastName"
               data-testid="input-last-name">
      </div>
      <div class="col-md-4">
        <label for="profileId" class="form-label form-label-sm mb-1">
          {{ 'users.fields.profile' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="profileId"
                class="form-select form-select-sm"
                [ngModel]="formUser().profileId"
                (ngModelChange)="updateField('profileId', $event)"
                name="profileId"
                required
                data-testid="select-profile">
          <option [ngValue]="null" disabled>{{ 'users.form.selectProfile' | translate }}</option>
          @for (profile of profiles(); track profile.id) {
            <option [ngValue]="profile.id">{{ profile.name }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Informes asignados -->
    <tp-selected-reports
      [ngModel]="formUser().reportIds"
      (ngModelChange)="updateField('reportIds', $event)"
      name="reportIds"
      [title]="'users.form.sectionReports' | translate"
      testId="user-reports">
    </tp-selected-reports>

    <!-- Botones de acción -->
    <div class="col-12 d-flex justify-content-end gap-2 mt-2">
      <button type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="onCancel()"
              data-testid="btn-cancel">
        {{ 'button.cancel' | translate }}
      </button>
      <button type="submit"
              class="btn btn-primary btn-sm"
              data-testid="btn-save">
        <i class="bi bi-check-lg me-1" aria-hidden="true"></i> {{ 'button.save' | translate }}
      </button>
    </div>
  </form>
</div>
