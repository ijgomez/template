<!-- Title -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ 'actions.form.editTitle' | translate }}</h1>
</div>

<div class="tp-filter-bar">
  <form id="actionForm" (ngSubmit)="onSubmit()" #actionForm="ngForm" novalidate data-testid="action-form">
    <h6 class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
      {{ 'actions.form.sectionGeneral' | translate }}
    </h6>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label for="actionCode" class="form-label form-label-sm mb-1">{{ 'actions.fields.code' | translate }}</label>
        <input id="actionCode"
               type="text"
               class="form-control form-control-sm"
               [value]="action().code"
               readonly
               disabled
               data-testid="input-code">
      </div>
      <div class="col-md-4">
        <label for="actionName" class="form-label form-label-sm mb-1">
          {{ 'actions.fields.name' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="actionName"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="editName()"
               (ngModelChange)="editName.set($event)"
               name="actionName"
               required
               data-testid="input-name">
      </div>
      <div class="col-md-4">
        <label for="actionType" class="form-label form-label-sm mb-1">
          {{ 'actions.fields.type' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="actionType"
                class="form-select form-select-sm"
                [ngModel]="editType()"
                (ngModelChange)="editType.set($event)"
                name="actionType"
                required
                [attr.aria-label]="'actions.fields.type' | translate"
                data-testid="select-type">
          @for (type of actionTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="col-12">
        <label for="actionDescription" class="form-label form-label-sm mb-1">{{ 'actions.fields.description' | translate }}</label>
        <textarea id="actionDescription"
                  class="form-control form-control-sm"
                  [ngModel]="editDescription()"
                  (ngModelChange)="editDescription.set($event)"
                  name="actionDescription"
                  rows="3"
                  data-testid="input-description"></textarea>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="col-12 d-flex justify-content-end gap-2 mt-2">
      <button type="button"
              class="btn btn-outline-secondary btn-sm"
              (click)="onCancel()"
              data-testid="btn-cancel">
        {{ 'button.cancel' | translate }}
      </button>
      <button type="submit"
              class="btn btn-primary btn-sm"
              [disabled]="saving()"
              data-testid="btn-save">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        }
        <i class="bi bi-check-lg me-1" aria-hidden="true"></i> {{ 'button.save' | translate }}
      </button>
    </div>
  </form>
</div>
