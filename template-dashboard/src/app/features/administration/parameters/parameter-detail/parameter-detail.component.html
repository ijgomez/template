<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">{{ 'parameters.detail.title' | translate }}</h1>
  <div class="d-flex gap-2">
    @if (canWrite()) {
      <button class="btn btn-primary btn-sm"
              (click)="onEdit()"
              data-testid="parameter-detail-btn-edit">
        <i class="bi bi-pencil me-1" aria-hidden="true"></i>{{ 'button.edit' | translate }}
      </button>
      <button class="btn btn-danger btn-sm"
              (click)="onDelete()"
              data-testid="parameter-detail-btn-delete">
        <i class="bi bi-trash me-1" aria-hidden="true"></i>{{ 'button.delete' | translate }}
      </button>
    }
    <button class="btn btn-outline-secondary btn-sm"
            (click)="onBack()"
            data-testid="parameter-detail-btn-back">
      <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{{ 'button.back' | translate }}
    </button>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="tp-form-grid">
      <div class="form-group">
        <label class="form-label fw-bold">{{ 'parameters.fields.code' | translate }}</label>
        <p class="form-control-plaintext"><code>{{ parameter().code }}</code></p>
      </div>
      <div class="form-group">
        <label class="form-label fw-bold">{{ 'parameters.fields.type' | translate }}</label>
        <p class="form-control-plaintext">
          <span class="badge bg-secondary">{{ parameter().type }}</span>
        </p>
      </div>
      <div class="form-group">
        <label class="form-label fw-bold">{{ 'parameters.fields.value' | translate }}</label>
        <p class="form-control-plaintext"><code>{{ parameter().value }}</code></p>
      </div>
      <div class="form-group form-field-full">
        <label class="form-label fw-bold">{{ 'parameters.fields.description' | translate }}</label>
        <p class="form-control-plaintext">{{ parameter().description || '-' }}</p>
      </div>
      <div class="form-group">
        <label class="form-label fw-bold">{{ 'parameters.fields.createdAt' | translate }}</label>
        <p class="form-control-plaintext">{{ parameter().createdAt | localDate }}</p>
      </div>
      <div class="form-group">
        <label class="form-label fw-bold">{{ 'parameters.fields.lastModifiedAt' | translate }}</label>
        <p class="form-control-plaintext">{{ parameter().lastModifiedAt | localDate }}</p>
      </div>
    </div>
  </div>
</div>
