<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">
    {{ (mode() === 'create' ? 'parameters.form.createTitle' : 'parameters.form.editTitle') | translate }}
  </h1>
  <button class="btn btn-outline-secondary btn-sm"
          (click)="onCancel()"
          data-testid="parameter-form-btn-back">
    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>{{ 'button.back' | translate }}
  </button>
</div>

<div class="tp-filter-bar">
  <form (ngSubmit)="onSubmit()" #paramForm="ngForm">
    <h6 class="text-muted text-uppercase fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
      {{ 'parameters.form.sectionGeneral' | translate }}
    </h6>
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <label for="paramCode" class="form-label form-label-sm mb-1">
          {{ 'parameters.fields.code' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="paramCode"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="formData().code"
               (ngModelChange)="updateField('code', $event)"
               name="paramCode"
               required
               [readonly]="mode() === 'edit'"
               data-testid="input-code">
      </div>
      <div class="col-md-4">
        <label for="paramType" class="form-label form-label-sm mb-1">
          {{ 'parameters.fields.type' | translate }} <span class="text-danger">*</span>
        </label>
        <select id="paramType"
                class="form-select form-select-sm"
                [ngModel]="formData().type"
                (ngModelChange)="updateField('type', $event)"
                name="paramType"
                required
                data-testid="select-type">
          @for (type of parameterTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>
      <div class="col-md-4">
        <label for="paramValue" class="form-label form-label-sm mb-1">
          {{ 'parameters.fields.value' | translate }} <span class="text-danger">*</span>
        </label>
        <input id="paramValue"
               type="text"
               class="form-control form-control-sm"
               [class.is-invalid]="typeValueError()"
               [ngModel]="formData().value"
               (ngModelChange)="updateField('value', $event)"
               name="paramValue"
               required
               data-testid="input-value">
        @if (typeValueError()) {
          <div class="invalid-feedback">{{ typeValueError() }}</div>
        }
      </div>
      <div class="col-12">
        <label for="paramDescription" class="form-label form-label-sm mb-1">{{ 'parameters.fields.description' | translate }}</label>
        <input id="paramDescription"
               type="text"
               class="form-control form-control-sm"
               [ngModel]="formData().description"
               (ngModelChange)="updateField('description', $event)"
               name="paramDescription"
               data-testid="input-description">
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-2">
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onCancel()" data-testid="parameter-form-btn-cancel">
        {{ 'button.cancel' | translate }}
      </button>
      <button type="submit" class="btn btn-primary btn-sm" data-testid="parameter-form-btn-save">
        {{ 'button.save' | translate }}
      </button>
    </div>
  </form>
</div>
