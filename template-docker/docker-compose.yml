name: template
services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: template-postgres:latest
    container_name: template-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template}
      POSTGRES_USER: ${POSTGRES_USER:-administrador}
      CREDENTIALS_FILE: /run/secrets/credentials
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    secrets:
      - credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-administrador} -d ${POSTGRES_DB:-template}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wildfly-1:
    build:
      context: ./wildfly
      dockerfile: Dockerfile
    image: template-wildfly:latest
    container_name: template-wildfly-1
    hostname: template-wildfly-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WILDFLY_HTTP_PORT:-8081}:8080"
      - "${WILDFLY_MANAGEMENT_PORT:-9991}:9990"
    environment:
      WILDFLY_ADMIN_USER: ${WILDFLY_ADMIN_USER:-admin}
      CREDENTIALS_FILE: /run/secrets/credentials
    secrets:
      - credentials

  wildfly-2:
    build:
      context: ./wildfly
      dockerfile: Dockerfile
    image: template-wildfly:latest
    container_name: template-wildfly-2
    hostname: template-wildfly-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WILDFLY2_HTTP_PORT:-8082}:8080"
      - "${WILDFLY2_MANAGEMENT_PORT:-9992}:9990"
    environment:
      WILDFLY_ADMIN_USER: ${WILDFLY_ADMIN_USER:-admin}
      CREDENTIALS_FILE: /run/secrets/credentials
    secrets:
      - credentials

  apache:
    build:
      context: ./apache
      dockerfile: Dockerfile
    image: template-apache:latest
    container_name: template-apache
    restart: unless-stopped
    depends_on:
      - wildfly-1
      - wildfly-2
    ports:
      - "${APACHE_HTTP_PORT:-8090}:80"

  openproject:
    build:
      context: ./openproject
      dockerfile: Dockerfile
    image: template-openproject:latest
    container_name: template-openproject
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENPROJECT_PORT:-8088}:80"
    environment:
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST_NAME:-localhost:8088}
      POSTGRES_USER: ${POSTGRES_USER:-administrador}
      OPENPROJECT_DB: ${OPENPROJECT_DB:-openproject}
      OPENPROJECT_RAILS__CACHE__STORE: ${OPENPROJECT_RAILS_CACHE_STORE:-memcache}
      CREDENTIALS_FILE: /run/secrets/credentials
    volumes:
      - openproject-assets:/var/openproject/assets
    secrets:
      - credentials

  mail:
    build:
      context: ./mail
      dockerfile: Dockerfile
    image: template-mail:latest
    container_name: template-mail
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

secrets:
  credentials:
    file: ./secrets/credentials.env

volumes:
  postgres-data:
  openproject-assets:
